<!DOCTYPE html>
<!--
  vote.html — 점메투 투표 페이지

  search.html에서 "+ 투표 후보에 담기"로 담은 후보(localStorage 키 jeommetu:vote-candidates)를
  읽어와 하나를 골라 확정하는 화면이다. 실시간 다자간 투표는 아직 없고(로드맵 참고),
  이번 버전은 한 사람이 후보 중 하나를 선택해 결과를 확인하는 방식이다.

  실행법: node server.js 로 서버를 띄운 뒤 http://localhost:8811/vote.html 접속.
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점메투 — 투표하기</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg: #0A0E0A;
  --panel: #111A12;
  --green: #3DFF6E;
  --green-dim: #1F7A3A;
  --amber: #FFB000;
  --ink: #DFFFE4;
  --star: #FFFFFF;
}

* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

/* ---------- 로그인 위젯/모달 (전 페이지 공용, js/auth.js가 주입) ---------- */
.auth-widget { position: fixed; top: 16px; right: 16px; z-index: 60; display: flex; align-items: center; gap: 8px; }
.auth-btn {
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  line-height: normal;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--green);
  padding: 8px 14px;
  width: 90px;
  text-align: center;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.auth-btn:hover { color: var(--green); }
.auth-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--green-dim); }

.mypage-btn {
  display: inline-block;
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  line-height: normal;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--green);
  padding: 8px 14px;
  width: 90px;
  text-align: center;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.mypage-btn:hover { color: var(--green); }
.mypage-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--green-dim); }
.mypage-btn[hidden] { display: none; }

.auth-modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10, 14, 10, 0.85);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.auth-modal-overlay[hidden] { display: none; }
.auth-modal {
  width: 100%; max-width: 360px;
  background: var(--panel);
  border: 2px solid var(--green);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 32px 24px;
  position: relative;
  text-align: left;
}
.auth-modal-close {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; color: var(--ink);
  font-size: 18px; cursor: pointer; font-family: 'Galmuri11', monospace;
}
.auth-modal h2 { font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none; font-size: 22px; color: var(--green); margin-bottom: 24px; }
.auth-context { font-size: 13px; color: var(--green); margin-bottom: 20px; }
.auth-field { margin-bottom: 16px; }
.auth-field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 6px; }
.auth-field input {
  width: 100%; background: var(--bg); border: 2px solid var(--green-dim); color: var(--ink);
  font-family: 'Pretendard', sans-serif; font-size: 15px; padding: 10px 12px;
}
.auth-field input:focus { outline: none; border-color: var(--green); }
.auth-actions { display: flex; gap: 12px; margin-top: 24px; }
.auth-actions .btn { flex: 1; font-size: 15px; padding: 12px; text-align: center; }
.auth-msg { font-size: 13px; margin-top: 12px; min-height: 1.4em; }
.auth-msg.is-error { color: var(--amber); }
.auth-msg.is-info { color: var(--ink); opacity: 0.8; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', sans-serif;
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
}

.dot { font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none; }
.dot-lg { font-family: 'Galmuri14', monospace; -webkit-font-smoothing: none; }

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 0 24px;
}

/* ---------- CRT scanline overlay (이 화면 전용) ---------- */
.scanline {
  position: fixed;
  inset: 0;
  z-index: 40;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    var(--green-dim) 0px,
    var(--green-dim) 1px,
    transparent 2px,
    transparent 4px
  );
  opacity: 0.06;
  animation: scan-move 9s linear infinite;
}
@keyframes scan-move {
  to { background-position: 0 160px; }
}

/* ---------- top bar ---------- */
.topbar {
  border-bottom: 2px solid var(--green-dim);
  padding: 16px 0;
}
.topbar-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.topbar-logo {
  font-size: 22px;
  color: var(--green);
  text-decoration: none;
  letter-spacing: 0.05em;
}

/* ---------- main ---------- */
.vote-main {
  padding: 64px 0 96px;
  text-align: center;
}
@media (max-width: 600px) { .vote-main { padding: 40px 0 64px; } }

.select-label {
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--green-dim);
  display: block;
  margin-bottom: 8px;
}
.select-title {
  font-size: 33px;
  color: var(--green);
  margin-bottom: 12px;
}
@media (max-width: 600px) { .select-title { font-size: 22px; } }

.select-sub {
  font-size: 15px;
  color: var(--ink);
  opacity: 0.8;
  margin-bottom: 40px;
}

/* ---------- status (후보 없음 안내) ---------- */
.status-box {
  background: var(--panel);
  border: 2px solid var(--green-dim);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 32px;
}
.status-box[hidden] { display: none; }
.status-msg { font-size: 14px; color: var(--green); margin-bottom: 16px; }
.status-sub { font-size: 14px; color: var(--ink); opacity: 0.8; }

/* ---------- vote grid (캐릭터 셀렉트) ---------- */
.vote-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  margin-bottom: 48px;
}
.vote-grid[hidden] { display: none; }
@media (max-width: 768px) {
  .vote-grid { grid-template-columns: repeat(2, 1fr); gap: 16px; }
}

.vote-item {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}

.vote-slot {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 100%;
  background: var(--panel);
  border: 2px solid var(--green);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 24px 12px 16px;
  cursor: pointer;
  font-family: inherit;
  color: inherit;
  transition: transform 0.05s;
}
.vote-slot:disabled { cursor: default; opacity: 0.7; }

.vote-link {
  display: block;
  text-align: center;
  font-size: 11px;
  color: var(--green-dim);
  text-decoration: underline;
  text-underline-offset: 4px;
}
.vote-link:hover { color: var(--ink); }
.vote-link:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

/* Stardew 스타일의 "선택 프레임" 코너 표식 — 색은 토큰만 사용 */
.vote-slot::before,
.vote-slot::after {
  content: '';
  position: absolute;
  width: 8px;
  height: 8px;
  border: 2px solid var(--green);
  opacity: 0;
  transition: opacity 0.1s;
}
.vote-slot::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
.vote-slot::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }
.vote-slot:hover::before,
.vote-slot:hover::after,
.vote-slot:focus-visible::before,
.vote-slot:focus-visible::after { opacity: 1; }

.vote-slot:active:not(:disabled) { transform: translate(2px, 2px); }
.vote-slot:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.slot-icon {
  font-size: 42px;
  color: var(--green);
}
.slot-name {
  font-size: 11px;
  color: var(--ink);
}
.slot-category {
  font-size: 11px;
  color: var(--ink);
  opacity: 0.6;
}

.vote-slot.flash {
  border-color: var(--amber);
  box-shadow: 4px 4px 0 var(--amber);
}
.vote-slot.selected {
  border-color: var(--amber);
  box-shadow: 4px 4px 0 var(--amber);
}
.vote-slot.selected .slot-icon { color: var(--amber); }

/* ---------- CTA ---------- */
.btn {
  display: inline-block;
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 22px;
  color: var(--bg);
  background: var(--amber);
  border: 2px solid var(--amber);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 16px 32px;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.05s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active {
  transform: translate(4px, 4px);
  box-shadow: 0 0 0 var(--green-dim);
}
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.btn:disabled:active { transform: none; box-shadow: 4px 4px 0 var(--green-dim); }
.btn[hidden] { display: none; }
@media (max-width: 600px) { .btn { font-size: 22px; padding: 14px 20px; } }

.result-line {
  margin-top: 24px;
  font-size: 15px;
  color: var(--ink);
  min-height: 1.7em;
}
.result-line strong { color: var(--amber); }

.back-links {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-top: 48px;
}
.back-link {
  font-size: 11px;
  color: var(--ink);
  text-decoration: none;
  border: 2px solid var(--green-dim);
  padding: 8px 12px;
  display: inline-block;
}
.back-link:hover { border-color: var(--green); color: var(--green); }

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .scanline { animation: none; }
}
</style>
</head>
<body>

<div class="scanline"></div>

<header class="topbar">
  <div class="container topbar-inner">
    <a href="index.html" class="topbar-logo dot-lg">점메투</a>
  </div>
</header>

<main class="container vote-main">
  <span class="select-label dot">GAME START</span>
  <h1 class="select-title dot">SELECT YOUR CHOICE</h1>
  <p class="select-sub">오늘 먹을 곳을 하나 골라주세요.</p>

  <div id="status" class="status-box" hidden></div>

  <div class="vote-grid" id="voteGrid"></div>

  <button type="button" class="btn" id="cta" disabled>▸ 오늘 여기서 먹자</button>
  <p class="result-line dot" id="resultLine" aria-live="polite"></p>

  <div class="back-links">
    <a href="search.html" class="back-link dot">← 후보 다시 고르기</a>
    <a href="index.html" class="back-link dot">← 홈으로</a>
  </div>
</main>

<script>window.JEOMMETU_MYPAGE_URL = 'mypage.html';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script>
(function () {
  'use strict';

  var CANDIDATES_KEY = 'jeommetu:vote-candidates';
  var ICONS = ['▣', '◆', '▤', '◐'];

  var voteGrid = document.getElementById('voteGrid');
  var statusEl = document.getElementById('status');
  var cta = document.getElementById('cta');
  var resultLine = document.getElementById('resultLine');

  var candidates = [];
  var selectedId = null;
  var confirmed = false;

  function loadCandidates() {
    try {
      var raw = localStorage.getItem(CANDIDATES_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (err) {
      return [];
    }
  }

  function escapeHtml(str) {
    var div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  function reduceMotion() {
    return window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function setStatus(html) {
    statusEl.innerHTML = html;
    statusEl.hidden = false;
  }

  function renderEmpty() {
    voteGrid.hidden = true;
    cta.hidden = true;
    setStatus(
      '<p class="status-msg dot">아직 담은 투표 후보가 없어요.</p>' +
      '<a class="btn" href="search.html">맛집 검색하러 가기</a>'
    );
  }

  function renderSlot(candidate, index) {
    var icon = ICONS[index % ICONS.length];
    var category = candidate.category
      ? '<span class="slot-category">' + escapeHtml(candidate.category) + '</span>'
      : '';
    return (
      '<div class="vote-item">' +
        '<button type="button" class="vote-slot" data-id="' + escapeHtml(candidate.id) + '" title="' + escapeHtml(candidate.address || '') + '">' +
          '<span class="slot-icon dot-lg">' + icon + '</span>' +
          '<span class="slot-name dot">' + escapeHtml(candidate.name) + '</span>' +
          category +
        '</button>' +
        '<a href="' + escapeHtml(candidate.url || '#') + '" target="_blank" rel="noopener noreferrer" class="vote-link dot">가게 보기 →</a>' +
      '</div>'
    );
  }

  function renderGrid() {
    voteGrid.innerHTML = candidates.map(renderSlot).join('');
  }

  function flashSlot(slot) {
    slot.classList.add('flash');
    var hold = reduceMotion() ? 0 : 300;
    window.setTimeout(function () { slot.classList.remove('flash'); }, hold);
  }

  function updateSelectionUI() {
    var slots = voteGrid.querySelectorAll('.vote-slot');
    slots.forEach(function (slot) {
      slot.classList.toggle('selected', slot.dataset.id === selectedId);
    });
    cta.disabled = !selectedId || confirmed;
  }

  voteGrid.addEventListener('click', function (e) {
    if (confirmed) return;
    var slot = e.target.closest('.vote-slot');
    if (!slot) return;
    selectedId = slot.dataset.id;
    flashSlot(slot);
    updateSelectionUI();
    resultLine.textContent = '';
  });

  cta.addEventListener('click', function () {
    var slots = voteGrid.querySelectorAll('.vote-slot');

    if (confirmed) {
      // 다시 고르기: 확정을 풀고 후보를 다시 선택할 수 있게 한다.
      confirmed = false;
      slots.forEach(function (slot) { slot.disabled = false; });
      cta.textContent = '▸ 오늘 여기서 먹자';
      resultLine.textContent = '';
      updateSelectionUI();
      return;
    }

    if (!selectedId) return;
    var picked = candidates.filter(function (c) { return c.id === selectedId; })[0];
    if (!picked) return;

    confirmed = true;
    slots.forEach(function (slot) { slot.disabled = true; });
    cta.disabled = false;
    cta.textContent = '다시 고르기';
    resultLine.innerHTML = '오늘의 선택은 <strong>' + escapeHtml(picked.name) + '</strong>입니다!';
  });

  candidates = loadCandidates();
  if (!candidates.length) {
    renderEmpty();
  } else {
    renderGrid();
    updateSelectionUI();
  }
})();
</script>
</body>
</html>
