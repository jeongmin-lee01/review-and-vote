<!DOCTYPE html>
<!--
  search.html — 점메투 맛집 검색 페이지

  실행법:
    1) .env.example 을 복사해 .env 를 만들고 KAKAO_REST_API_KEY= 뒤에
       카카오 개발자센터에서 발급받은 REST API 키를 채워 넣는다.
    2) 터미널에서 `node server.js` 실행 (Node 내장 모듈만 사용, npm install 불필요).
    3) 브라우저에서 http://localhost:8811/search.html 접속.

  이 페이지의 JS(js/search.js)는 카카오 API를 직접 호출하지 않고,
  같은 오리진의 /api/search 프록시(server.js)만 호출한다.
  REST API 키는 서버에만 있고 브라우저 네트워크 탭에는 절대 노출되지 않는다.

  중요 — 반드시 `node server.js` 로만 열 것:
    server.js는 /api/search 프록시뿐 아니라 index.html, vote.html 등
    정적 파일도 같은 포트(기본 8811)에서 함께 서빙한다. 즉 node server.js
    하나만 실행하면 랜딩페이지·투표 데모·이 검색 페이지가 전부 동작한다.
    `npx serve` 같은 순수 정적 서버로 이 파일을 열면 /api/search 라우트가
    없어서 검색 버튼을 눌러도 항상 실패한다 (js/search.js가 이를 감지해
    상단에 안내 배너를 띄운다).
-->
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>점메투 — 맛집 검색</title>
<style>
@import url('https://cdn.jsdelivr.net/npm/galmuri/dist/galmuri.css');
@import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

:root {
  --bg: #0A0E0A;
  --panel: #111A12;
  --green: #3DFF6E;
  --green-dim: #1F7A3A;
  --amber: #FFB000;
  --ink: #DFFFE4;
}

* { box-sizing: border-box; margin: 0; padding: 0; border-radius: 0 !important; }

/* ---------- 로그인 위젯/모달 (전 페이지 공용, js/auth.js가 주입) ---------- */
.btn {
  display: inline-block;
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 22px;
  color: var(--bg);
  background: var(--amber);
  border: 2px solid var(--amber);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 16px 32px;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.05s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translate(4px, 4px); box-shadow: 0 0 0 var(--green-dim); }
.btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.auth-widget { position: fixed; top: 16px; right: 16px; z-index: 60; display: flex; align-items: center; gap: 8px; }
.auth-btn {
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--green);
  padding: 8px 14px;
  width: 90px;
  text-align: center;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.auth-btn:hover { color: var(--green); }
.auth-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--green-dim); }

.mypage-btn {
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  color: var(--ink);
  background: var(--panel);
  border: 2px solid var(--green);
  padding: 8px 14px;
  width: 90px;
  text-align: center;
  cursor: pointer;
  text-decoration: none;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.mypage-btn:hover { color: var(--green); }
.mypage-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--green-dim); }
.mypage-btn[hidden] { display: none; }

.auth-modal-overlay {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(10, 14, 10, 0.85);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
}
.auth-modal-overlay[hidden] { display: none; }
.auth-modal {
  width: 100%; max-width: 360px;
  background: var(--panel);
  border: 2px solid var(--green);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 32px 24px;
  position: relative;
  text-align: left;
}
.auth-modal-close {
  position: absolute; top: 12px; right: 12px;
  background: none; border: none; color: var(--ink);
  font-size: 18px; cursor: pointer; font-family: 'Galmuri11', monospace;
}
.auth-modal h2 { font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none; font-size: 22px; color: var(--green); margin-bottom: 24px; }
.auth-context { font-size: 13px; color: var(--green); margin-bottom: 20px; }
.auth-field { margin-bottom: 16px; }
.auth-field label { display: block; font-size: 13px; color: var(--ink); margin-bottom: 6px; }
.auth-field input {
  width: 100%; background: var(--bg); border: 2px solid var(--green-dim); color: var(--ink);
  font-family: 'Pretendard', sans-serif; font-size: 15px; padding: 10px 12px;
}
.auth-field input:focus { outline: none; border-color: var(--green); }
.auth-actions { display: flex; gap: 12px; margin-top: 24px; }
.auth-actions .btn { flex: 1; font-size: 15px; padding: 12px; text-align: center; }
.auth-msg { font-size: 13px; margin-top: 12px; min-height: 1.4em; }
.auth-msg.is-error { color: var(--amber); }
.auth-msg.is-info { color: var(--ink); opacity: 0.8; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Pretendard', sans-serif;
  font-size: 16px;
  line-height: 1.7;
  min-height: 100vh;
}

.dot { font-family: 'Galmuri11', monospace; -webkit-font-smoothing: none; }
.dot-lg { font-family: 'Galmuri14', monospace; -webkit-font-smoothing: none; }

.container {
  max-width: 1080px;
  margin: 0 auto;
  padding: 48px 24px 96px;
}

/* ---------- header ---------- */
.page-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 16px;
  border-bottom: 2px solid var(--green-dim);
  padding-bottom: 24px;
  margin-bottom: 32px;
}

.page-title {
  font-size: 28px;
  color: var(--green);
}
@media (max-width: 600px) { .page-title { font-size: 14px; } }

.back-link {
  font-size: 11px;
  color: var(--ink);
  text-decoration: none;
  border: 2px solid var(--green-dim);
  padding: 8px 12px;
  display: inline-block;
}
.back-link:hover { border-color: var(--green); color: var(--green); }

/* ---------- search bar ---------- */
.search-bar {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 8px;
}

.search-input {
  flex: 1 1 240px;
  background: var(--panel);
  border: 2px solid var(--green-dim);
  color: var(--ink);
  font-family: 'Pretendard', sans-serif;
  font-size: 16px;
  padding: 14px 16px;
}
.search-input:focus { outline: none; border-color: var(--green); }

.category-select {
  background: var(--panel);
  border: 2px solid var(--green-dim);
  color: var(--ink);
  font-family: 'Pretendard', sans-serif;
  font-size: 16px;
  padding: 14px 12px;
}
.category-select:focus { outline: none; border-color: var(--green); }

.search-btn {
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  background: var(--amber);
  color: var(--bg);
  border: 2px solid var(--amber);
  padding: 0 24px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.search-btn:hover { filter: brightness(1.1); }
.search-btn:active { box-shadow: 2px 2px 0 var(--green-dim); transform: translate(2px, 2px); }

.search-hint {
  font-size: 13px;
  color: var(--ink);
  opacity: 0.7;
  margin-bottom: 40px;
}

/* ---------- status ---------- */
.status-box {
  background: var(--panel);
  border: 2px solid var(--green-dim);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 32px;
}
.status-box[hidden] { display: none; }
.status-msg { font-size: 14px; color: var(--green); margin-bottom: 8px; }
.status-msg.status-error { color: var(--amber); }
.status-sub { font-size: 14px; color: var(--ink); opacity: 0.8; }

/* ---------- results ---------- */
.results {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
}
@media (max-width: 700px) { .results { grid-template-columns: 1fr; } }

.card {
  background: var(--panel);
  border: 2px solid var(--green-dim);
  box-shadow: 4px 4px 0 var(--green-dim);
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.card-name {
  font-size: 16px;
  color: var(--green);
  line-height: 1.5;
}

.card-category {
  font-size: 13px;
  color: var(--ink);
  opacity: 0.75;
}

.card-meta { display: flex; flex-direction: column; gap: 6px; }
.card-meta-row { display: flex; gap: 8px; font-size: 14px; color: var(--ink); }
.card-meta-row dt { flex: 0 0 40px; opacity: 0.6; }
.card-meta-row dd { flex: 1; word-break: break-all; }

.card-link {
  margin-top: auto;
  align-self: flex-start;
  font-size: 13px;
  color: var(--ink);
  text-decoration: none;
  border-bottom: 2px solid var(--green-dim);
  padding-bottom: 2px;
}
.card-link:hover { color: var(--green); border-color: var(--green); }

.card { cursor: pointer; }

.card-actions {
  margin-top: auto;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
}
.card-actions .card-link { margin-top: 0; align-self: auto; }

.card-btn-group {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 8px;
}

.pick-add-btn {
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  background: var(--bg);
  color: var(--green);
  border: 2px solid var(--green);
  padding: 6px 14px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.pick-add-btn:hover { background: var(--green); color: var(--bg); }
.pick-add-btn:active { box-shadow: 2px 2px 0 var(--green-dim); transform: translate(2px, 2px); }
.pick-add-btn:disabled { opacity: 0.6; cursor: default; }
.pick-add-btn.is-picked { background: var(--green); color: var(--bg); }
.pick-add-btn.is-picked:hover { background: var(--bg); color: var(--green); }

.vote-add-btn {
  font-family: 'Galmuri11', monospace;
  -webkit-font-smoothing: none;
  font-size: 11px;
  background: var(--green);
  color: var(--bg);
  border: 2px solid var(--green);
  padding: 6px 14px;
  cursor: pointer;
  box-shadow: 4px 4px 0 var(--green-dim);
}
.vote-add-btn:hover { filter: brightness(1.1); }
.vote-add-btn:active { box-shadow: 2px 2px 0 var(--green-dim); transform: translate(2px, 2px); }

.review-toggle {
  align-self: flex-start;
  background: none;
  border: none;
  padding: 0;
  font-size: 13px;
  color: var(--green);
  cursor: pointer;
}
.review-toggle:hover { text-decoration: underline; }

/* ---------- review panel ---------- */
.review-panel {
  border-top: 2px solid var(--green-dim);
  margin-top: 4px;
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.review-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
}

.review-label {
  font-size: 13px;
  color: var(--green);
}

.review-rating {
  font-size: 13px;
  color: var(--ink);
}
.review-rating .amber-num { color: var(--amber); }

.review-list {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.review-item {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding-top: 12px;
  border-top: 2px solid var(--green-dim);
}
.review-item:first-child { border-top: none; padding-top: 0; }

.review-meta {
  display: flex;
  gap: 8px;
  font-size: 13px;
  color: var(--ink);
  opacity: 0.75;
}

.review-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.6;
  word-break: break-word;
}

/* ---------- AI 분석 ---------- */
.ai-analysis {
  border-top: 2px solid var(--green-dim);
  margin-top: 4px;
  padding-top: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ai-analysis-inner {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.sentiment-bar {
  display: flex;
  width: 100%;
  height: 16px;
  border: 2px solid var(--green-dim);
  overflow: hidden;
}
.sentiment-seg { height: 100%; }
.sentiment-pos { background: var(--green); }
.sentiment-neu { background: var(--green-dim); }
.sentiment-neg { background: var(--amber); }

.sentiment-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  font-size: 13px;
  color: var(--ink);
  opacity: 0.85;
}
.sentiment-legend-item { display: flex; align-items: center; gap: 6px; }
.sentiment-dot { display: inline-block; width: 8px; height: 8px; }
.sentiment-dot-pos { background: var(--green); }
.sentiment-dot-neu { background: var(--green-dim); }
.sentiment-dot-neg { background: var(--amber); }

.word-cloud {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 12px;
}
.word-cloud-item {
  font-family: 'Pretendard', sans-serif;
  line-height: 1.3;
}
.word-positive { color: var(--green); }
.word-negative { color: var(--amber); }

.ai-verdict {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.verdict-bubble {
  position: relative;
  background: var(--panel);
  border: 2px solid var(--green-dim);
  padding: 12px 16px;
  margin-left: 4px;
}
.verdict-bubble::before {
  content: '';
  position: absolute;
  top: -10px;
  left: 16px;
  width: 0;
  height: 0;
  border-left: 8px solid transparent;
  border-right: 8px solid transparent;
  border-bottom: 10px solid var(--green-dim);
}
.verdict-bubble::after {
  content: '';
  position: absolute;
  top: -6px;
  left: 18px;
  width: 0;
  height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-bottom: 8px solid var(--panel);
}
.verdict-text {
  font-size: 14px;
  color: var(--ink);
  line-height: 1.6;
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<div class="container">
  <header class="page-header">
    <h1 class="page-title dot-lg">맛집 검색</h1>
    <a class="back-link dot" href="index.html">← 홈으로</a>
  </header>

  <form id="search-form" class="search-bar">
    <input
      id="search-input"
      class="search-input"
      type="text"
      placeholder="예: 강남 파스타"
      autocomplete="off"
    >
    <select id="category-select" class="category-select">
      <option value="">전체</option>
      <option value="FD6">음식점</option>
      <option value="CE7">카페</option>
    </select>
    <button type="submit" class="search-btn">검색</button>
  </form>
  <p class="search-hint">카카오 로컬 API 기반으로 가게명, 카테고리, 주소, 전화번호를 보여줍니다.</p>

  <div id="status" class="status-box" hidden></div>

  <ul id="results" class="results"></ul>
</div>

<script>window.JEOMMETU_MYPAGE_URL = 'mypage.html';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/auth.js"></script>
<script src="js/search.js"></script>
<script src="js/picks.js"></script>
</body>
</html>
